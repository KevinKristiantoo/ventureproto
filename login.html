<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f4a35">
  <title>Matcha Cih — Racik Matcha-mu</title>
  <meta name="description" content="Matcha Cih: racik matcha custom-mu sendiri, fresh di booth kampus. Interactive cup, taste profile, dan resep yang bisa di-share.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back" onclick="location.href='index.html'" aria-label="Kembali">‹</button>
    <div class="brand"><img class="logo" src="logomatcha.jpeg" alt="Logo Matcha Cih"> Matcha Cih</div>
    <span class="spacer"></span>
    <button class="mode-toggle" id="modeToggle" onclick="toggleViewMode()" aria-label="Ganti mode tampilan">
      <span class="mt-ico">🖥️</span><span class="mt-label">Desktop Mode</span>
    </button>
  </div>

  <div class="screen">
    <div class="auth-wrap">
      <div class="auth-card card">
        <div class="center">
          <div style="font-size:44px">🍵</div>
          <h1 class="title" style="font-size:22px;margin-top:6px">Masuk ke Matcha Cih</h1>
          <p class="sub mt-8">Login itu <strong>opsional</strong> — kamu tetap bisa memesan tanpa akun.
            Login berguna untuk admin booth atau menyimpan preferensi.</p>
        </div>

        <!-- Tab switch: Login / Daftar -->
        <div class="auth-tabs mt-16">
          <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
          <button class="auth-tab" id="tabReg" onclick="switchTab('register')">Daftar</button>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="cth: admin" maxlength="40" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" maxlength="60" autocomplete="current-password">
        </div>

        <button class="btn btn-primary btn-block btn-lg mt-16" id="btnSubmit">Login</button>
        <button class="btn btn-ghost btn-block mt-8" onclick="skip()">Lewati / Skip →</button>

        <p class="sub center mt-12" id="authMsg"></p>
        <p class="sub center mt-8" style="font-size:12px;opacity:.8">
          Admin demo: <strong>admin</strong> / <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/store-api.js"></script>
<script src="assets/js/data.js"></script>
<script>
(function () {
  let mode = 'login';
  const params = new URLSearchParams(location.search);
  // Setelah login, arahkan ke halaman ini (mis. dari admin). Default: index.
  const next = params.get('next') || 'index.html';

  window.switchTab = function (m) {
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m === 'login');
    document.getElementById('tabReg').classList.toggle('active', m === 'register');
    document.getElementById('btnSubmit').textContent = m === 'login' ? 'Login' : 'Daftar Akun';
    document.getElementById('password').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    document.getElementById('authMsg').textContent = '';
  };

  window.skip = function () {
    // Tandai bahwa user memilih skip supaya tidak dipaksa login lagi.
    Store.set('skippedLogin', true);
    location.href = 'index.html';
  };

  document.getElementById('btnSubmit').onclick = submit;
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  function submit() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('authMsg');
    if (!username || !password) { msg.textContent = 'Isi username & password dulu ya.'; return; }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; btn.textContent = 'Memproses…';

    fetch('api/auth.php?action=' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        btn.textContent = mode === 'login' ? 'Login' : 'Daftar Akun';
        if (!res.ok) { msg.textContent = res.error || 'Gagal.'; return; }
        Store.set('user', res.user);
        showToast('Halo, ' + res.user.username + '! 👋');
        // Admin langsung ke dashboard admin.
        setTimeout(() => {
          location.href = res.user.role === 'admin' ? 'admin.html' : next;
        }, 500);
      })
      .catch(() => { btn.disabled = false; btn.textContent = 'Login'; msg.textContent = 'Server tidak merespons.'; });
  }
})();
</script>
</body>
</html>
