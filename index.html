<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f4a35">
  <title>Matcha Cih — Racik Matcha-mu</title>
  <meta name="description" content="Matcha Cih: racik matcha custom-mu sendiri, fresh di booth kampus. Interactive cup, taste profile, dan resep yang bisa di-share.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <img class="logo" src="logomatcha.jpeg" alt="Logo Matcha Cih"> Matcha Cih
    </div>
    <span class="spacer"></span>
    <button class="login-chip" id="loginChip" onclick="accountAction()">👤 <span id="loginLabel">Login</span></button>
    <button class="mode-toggle" id="modeToggle" onclick="toggleViewMode()" aria-label="Ganti mode tampilan">
      <span class="mt-ico">🖥️</span><span class="mt-label">Desktop Mode</span>
    </button>
    <button class="cart-chip" id="cartChip" onclick="location.href='page/cart.html'">🛒 <span id="cartCount">0</span></button>
  </div>

  <div class="screen">
    <!-- Booth status (dikontrol admin) -->
    <div class="booth" id="boothBanner" data-tone="off">
      <span class="pulse"></span>
      <div>
        <div class="label" id="boothTitle">Memuat status booth…</div>
        <div class="val" id="boothDesc">Mohon tunggu.</div>
      </div>
    </div>

    <div class="home-hero mt-16">
      <div class="hero-copy">
        <p class="eyebrow">Selamat datang di Lab Matcha</p>
        <h1 class="title">Racik matcha-mu,<br>persis selera kamu.</h1>
        <p class="sub mt-8">Teh hijau Jepang otentik, dibuat fresh di booth kampus.</p>
      </div>

      <!-- Two entry modes -->
      <div class="mode-grid">
        <button class="mode-btn primary" onclick="location.href='page/lab.html'">
          <span class="emoji">🧪</span>
          <span>
            <div class="m-title">Racik Sendiri</div>
            <div class="m-desc">Custom Lab — atur intensitas, base, topping</div>
          </span>
          <span class="arrow">→</span>
        </button>

        <button class="mode-btn secondary" onclick="location.href='page/menu.html'">
          <span class="emoji">⭐</span>
          <span>
            <div class="m-title">Menu Rekomendasi</div>
            <div class="m-desc">Best seller siap saji buat yang buru-buru</div>
          </span>
          <span class="arrow">→</span>
        </button>

        <button class="btn btn-ghost btn-block" onclick="location.href='page/history.html'">🧾 Riwayat Pembelian</button>
        <button class="btn btn-ghost btn-block mt-8" onclick="location.href='page/support.html'">💬 Customer Service</button>
      </div>
    </div>

    <!-- Menu utama -->
    <h2 class="section">Menu Utama 🍵</h2>
    <div class="recipe-list as-grid" id="popularList">
      <div class="empty"><div class="e-emoji">🍵</div><div>Memuat racikan komunitas…</div></div>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/data.js"></script>
<script>
  // Cart count badge
  (function () {
    const cart = Store.get('cart', []);
    document.getElementById('cartCount').textContent = cart.length;
  })();

  // Status booth (dikontrol admin) — muat & refresh berkala
  (function () {
    function loadBooth() {
      const res = MatchaAPI.Booth.get();
      if (!res.ok || !res.booth) return;
      const b = res.booth;
      const banner = document.getElementById('boothBanner');
      banner.dataset.tone = b.tone;
      document.getElementById('boothTitle').textContent = 'Status Booth · ' + b.title;
      document.getElementById('boothDesc').textContent = b.desc;
    }
    loadBooth();
    setInterval(loadBooth, 15000); // refresh tiap 15 detik
  })();

  // Load menu utama
  (function () {
    const res = MatchaAPI.Recipe.popular();
    const wrap = document.getElementById('popularList');
    if (!res.ok || !res.recipes || !res.recipes.length) {
      wrap.innerHTML = '<div class="empty"><div class="e-emoji">🌱</div><div>Menu belum tersedia.</div></div>';
      return;
    }
    wrap.innerHTML = '';
    res.recipes.forEach((rec) => {
      const b = computeBuild(rec.config);
      const el = document.createElement('div');
      el.className = 'recipe-item';
      // Nama file gambar = nama menu; Matcha Latte pakai .webp, lainnya .jpg.
      const ext = rec.name === 'Matcha Latte' ? 'webp' : 'jpg';
      const img = encodeURIComponent(rec.name) + '.' + ext;
      const slug = rec.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      el.innerHTML = `
        <img class="r-thumb" data-menu="${slug}" src="${img}" alt="${escapeHtml(rec.name)}"
             onerror="this.style.display='none'">
        <div>
          <div class="r-name">${escapeHtml(rec.name)}</div>
          <div class="r-meta">${b.intensity.name} · ${b.base.name} · ${IDR(b.price)}</div>
        </div>
        <div class="r-orders">Pilih →</div>`;
      el.onclick = () => {
        Store.set('build', rec.config);
        Store.set('buildName', rec.name);
        location.href = 'page/lab.html?loaded=1';
      };
      wrap.appendChild(el);
    });
  })();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
