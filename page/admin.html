<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f4a35">
  <title>Matcha Cih — Admin Booth</title>
  <meta name="description" content="Matcha Cih: dashboard admin booth.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back" onclick="location.href='../index.html?stay=1'" aria-label="Lihat toko" title="Lihat halaman toko">‹</button>
    <div class="brand"><span class="logo">🛠️</span> Admin Booth</div>
    <span class="spacer"></span>
    <button class="login-chip is-user" id="loginChip" onclick="accountAction()">👤 <span id="loginLabel">admin</span></button>
    <button class="mode-toggle" id="modeToggle" onclick="toggleViewMode()" aria-label="Ganti mode tampilan">
      <span class="mt-ico">🖥️</span><span class="mt-label">Desktop Mode</span>
    </button>
  </div>

  <div class="screen">
    <div id="adminRoot">
      <div class="admin-empty"><div class="e-emoji">🔐</div><div>Memeriksa akses…</div></div>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/data.js"></script>
<script>
(function () {
  const STATUS_LABEL = { received: 'Diterima', brewing: 'Diseduh', ready: 'Siap Diambil', done: 'Sudah Diambil' };
  const NEXT_LABEL   = { received: '→ Mulai Seduh', brewing: '→ Tandai Siap' };
  let filter = 'active';
  let pollTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(String(iso).replace(' ', 'T'));
    if (isNaN(d)) return esc(iso);
    return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  // Cek akses admin dulu.
  const who = MatchaAPI.Auth.whoami();
  if (!who.ok || !who.user || who.user.role !== 'admin') {
    document.getElementById('adminRoot').innerHTML =
      '<div class="admin-empty"><div class="e-emoji">🔒</div>' +
      '<div>Halaman ini khusus admin.</div>' +
      '<button class="btn btn-primary mt-16" onclick="location.href=\'login.html?next=admin.html\'">Login sebagai Admin</button></div>';
  } else {
    document.getElementById('loginLabel').textContent = who.user.username;
    renderShell();
    load();
    pollTimer = setInterval(load, 6000); // auto-refresh daftar pesanan
  }

  function renderShell() {
    document.getElementById('adminRoot').innerHTML = `
      <h1 class="title" style="font-size:22px">Pesanan Masuk</h1>
      <p class="sub mt-8">Pantau pesanan user & lanjutkan statusnya. Daftar refresh otomatis tiap 6 detik.</p>

      <div class="booth-control" id="boothControl">
        <div class="bc-head">
          <strong>Status Booth</strong>
          <span class="bc-now" id="bcNow" data-tone="off">Memuat…</span>
        </div>
        <div class="bc-btns">
          <button class="bc-btn" data-s="offline">Belum Aktif</button>
          <button class="bc-btn" data-s="busy">Busy</button>
          <button class="bc-btn" data-s="taking">Taking Order</button>
          <button class="bc-btn" data-s="free">Free for Order</button>
        </div>
        <div class="bc-code" id="bcCodeRow" style="display:none">
          <span class="sub">Kode order yang dikerjakan:</span>
          <select id="bcCode"></select>
          <button class="btn btn-primary" id="bcApply">Terapkan</button>
        </div>
      </div>

      <div class="booth-control" id="ticketControl">
        <div class="bc-head">
          <strong>Nomor Tiket</strong>
          <span class="sub">Reset urutan pembelian ke awal (?-001).</span>
          <button class="btn btn-danger" id="btnResetTicket" style="margin-left:auto">🔁 Reset Nomor Tiket</button>
        </div>
      </div>

      <div class="booth-control">
        <div class="bc-head">
          <strong>Customer Service</strong>
          <span class="sub">Pesan &amp; pertanyaan dari pengunjung.</span>
          <button class="btn btn-primary" style="margin-left:auto" onclick="location.href='admin_support.html'">💬 Buka Chat CS</button>
        </div>
      </div>

      <div class="admin-toolbar mt-16" id="filters"></div>
      <div id="orderList"><div class="admin-empty"><div class="e-emoji">🍵</div><div>Memuat…</div></div></div>
    `;
    renderFilters({ received: 0, brewing: 0, ready: 0, done: 0, all: 0 });
    initBoothControl();
  }

  // ===== Kontrol Status Booth =====
  let boothActiveOrders = [];
  function initBoothControl() {
    loadBooth();
    loadActiveCodes();
    document.querySelectorAll('.bc-btn').forEach(b => {
      b.onclick = () => {
        const s = b.dataset.s;
        if (s === 'taking') {
          document.getElementById('bcCodeRow').style.display = 'flex';
          highlightBtn('taking');
        } else {
          document.getElementById('bcCodeRow').style.display = 'none';
          setBooth(s, '');
        }
      };
    });
    document.getElementById('bcApply').onclick = () => {
      const code = document.getElementById('bcCode').value;
      setBooth('taking', code);
    };
    const rt = document.getElementById('btnResetTicket');
    if (rt) rt.onclick = resetTicket;
  }

  function resetTicket(force) {
    if (force !== true) {
      if (!confirm('Reset nomor tiket ke awal? Pesanan berikutnya akan mulai dari #001.')) return;
    }
    const res = MatchaAPI.Order.resetTicket(force === true);
    if (res.ok) { showToast('Nomor tiket direset. Berikutnya mulai #001.'); return; }
    if (res.needConfirm) {
      if (confirm(res.error + '\n\nLanjut paksa reset sekarang?')) resetTicket(true);
      return;
    }
    showToast(res.error || 'Gagal reset');
  }

  function highlightBtn(s) {
    document.querySelectorAll('.bc-btn').forEach(b => b.classList.toggle('active', b.dataset.s === s));
  }

  function loadBooth() {
    const res = MatchaAPI.Booth.get();
    if (!res.ok) return;
    const b = res.booth;
    const now = document.getElementById('bcNow');
    now.textContent = b.title + (b.code ? ' · #' + b.code : '');
    now.dataset.tone = b.tone;
    highlightBtn(b.status);
    if (b.status === 'taking') document.getElementById('bcCodeRow').style.display = 'flex';
  }

  function loadActiveCodes() {
    const res = MatchaAPI.Order.list('active');
    if (res.ok) { boothActiveOrders = (res.orders || []).map(o => o.code); fillCodeOptions(); }
  }

  function fillCodeOptions() {
    const sel = document.getElementById('bcCode');
    if (!sel) return;
    const prev = sel.value;
    const opts = boothActiveOrders.map(c => `<option value="${esc(c)}">#${esc(c)}</option>`).join('');
    sel.innerHTML = opts || '<option value="">(tidak ada order aktif)</option>';
    if (prev) sel.value = prev;
  }

  function setBooth(status, code) {
    const res = MatchaAPI.Booth.set(status, code);
    if (res.ok) { showToast('Status booth: ' + res.booth.title); loadBooth(); }
    else showToast(res.error || 'Gagal ubah status');
  }

  function renderFilters(counts) {
    const defs = [
      ['active', 'Aktif', (counts.received || 0) + (counts.brewing || 0)],
      ['received', 'Diterima', counts.received || 0],
      ['brewing', 'Diseduh', counts.brewing || 0],
      ['ready', 'Siap', counts.ready || 0],
      ['done', 'Sudah Diambil', counts.done || 0],
      ['all', 'Semua', counts.all || 0],
    ];
    let html = defs.map(([key, label, n]) =>
      `<button class="admin-filter ${key === filter ? 'active' : ''}" data-f="${key}">${label}<span class="badge">${n}</span></button>`
    ).join('');
    if (filter === 'all' && (counts.all || 0) > 0) {
      html += `<button class="btn btn-danger" id="btnClearAll" style="margin-left:auto">🗑️ Hapus Semua Data</button>`;
    }
    document.getElementById('filters').innerHTML = html;
    document.querySelectorAll('.admin-filter').forEach(b => {
      b.onclick = () => { filter = b.dataset.f; load(); };
    });
    const clearBtn = document.getElementById('btnClearAll');
    if (clearBtn) clearBtn.onclick = clearAll;
  }

  function clearAll() {
    if (!confirm('Hapus SEMUA data pesanan? Tindakan ini permanen dan tidak bisa dibatalkan.')) return;
    if (!confirm('Yakin? Semua riwayat pesanan akan hilang.')) return;
    const res = MatchaAPI.Order.clear();
    if (res.ok) { showToast(res.deleted + ' pesanan dihapus'); load(); }
    else showToast(res.error || 'Gagal menghapus');
  }

  function deleteOne(code, btn) {
    if (!confirm('Hapus pesanan #' + code + '? Tindakan ini permanen.')) return;
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    const res = MatchaAPI.Order.delete(code);
    if (res.ok) { showToast('#' + code + ' dihapus'); load(); }
    else { showToast(res.error || 'Gagal'); if (btn) btn.disabled = false; }
  }

  function collect(code, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    const res = MatchaAPI.Order.collect(code);
    if (res.ok) { showToast('#' + code + ' → Sudah Diambil'); load(); }
    else { showToast(res.error || 'Gagal'); if (btn) btn.disabled = false; }
  }

  function load() {
    const res = MatchaAPI.Order.list(filter);
    if (!res.ok) {
      if (pollTimer) clearInterval(pollTimer);
      document.getElementById('orderList').innerHTML =
        '<div class="admin-empty"><div class="e-emoji">🔒</div><div>' + esc(res.error || 'Akses ditolak') + '</div></div>';
      return;
    }
    renderFilters(res.counts || {});
    renderOrders(res.orders || []);
    if (filter === 'active') { boothActiveOrders = (res.orders || []).map(o => o.code); fillCodeOptions(); }
  }

  function renderOrders(orders) {
    const wrap = document.getElementById('orderList');
    if (!orders.length) {
      wrap.innerHTML = '<div class="admin-empty"><div class="e-emoji">✅</div><div>Tidak ada pesanan di filter ini.</div></div>';
      return;
    }
    wrap.className = 'order-grid';
    wrap.innerHTML = orders.map(o => {
      const items = o.cart.map(it => `
        <div class="oc-item"><span class="n">${esc(it.recipeName)}</span><span>${IDR(it.price)}</span></div>
        <div class="oc-ing">${(it.ingredients || []).map(esc).join(' · ')}</div>
      `).join('');

      let actionBtn = '';
      if (o.status === 'received' || o.status === 'brewing') {
        actionBtn = `<button class="btn btn-primary btn-sm" data-act="advance" data-code="${esc(o.code)}">${NEXT_LABEL[o.status]}</button>`;
      } else if (o.status === 'ready') {
        actionBtn = `<button class="btn btn-primary btn-sm" data-act="collect" data-code="${esc(o.code)}">Sudah diterima?</button>`;
      } else {
        actionBtn = `<span class="status-pill done">Sudah Diambil ✓</span>`;
      }

      return `
        <div class="order-card">
          <div class="oc-head">
            <span class="oc-code">#${esc(o.code)}</span>
            <span class="status-pill ${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
            <span class="oc-time">${fmtTime(o.createdAt)}</span>
          </div>
          <div class="oc-cust">👤 ${esc(o.nick)} · 📱 ${esc(o.whatsapp || '-')}</div>
          ${o.note ? `<div class="oc-ing">📝 ${esc(o.note)}</div>` : ''}
          <div class="oc-items">${items}</div>
          <div class="oc-foot">
            <span class="oc-total">${IDR(o.total)}</span>
            <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
              ${actionBtn}
              <button class="btn btn-ghost btn-icon" data-act="chat" data-code="${esc(o.code)}" title="Buka chat CS">💬</button>
              <button class="btn btn-danger btn-icon" data-act="delete" data-code="${esc(o.code)}" title="Hapus pesanan">🗑️</button>
            </span>
          </div>
        </div>`;
    }).join('');

    wrap.querySelectorAll('button[data-act]').forEach(b => {
      const code = b.dataset.code;
      if (b.dataset.act === 'advance') b.onclick = () => advance(code, b);
      else if (b.dataset.act === 'collect') b.onclick = () => collect(code, b);
      else if (b.dataset.act === 'delete') b.onclick = () => deleteOne(code, b);
      else if (b.dataset.act === 'chat') b.onclick = () => { location.href = 'admin_support.html?code=' + encodeURIComponent(code); };
    });
  }

  function advance(code, btn) {
    btn.disabled = true; btn.textContent = '…';
    const res = MatchaAPI.Order.advance(code);
    if (res.ok) { showToast('#' + code + ' → ' + (STATUS_LABEL[res.order.status] || res.order.status)); load(); }
    else { showToast(res.error || 'Gagal'); btn.disabled = false; }
  }
})();
</script>
</body>
</html>
